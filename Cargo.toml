[package]
name = "tstat"
version = "0.2.0"
edition = "2021"

[dependencies]
# свежая pcap: умеет открывать по имени без перечисления всех интерфейсов
pcap = "2.3"
# лёгкий парсер уровней L2/L3/L4 (оставляем твой выбор)
pktparse = "0.7.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# вывод и форматирование
comfy-table = "7.1"
bytesize = "1.3"

# сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# утилиты
anyhow = "1.0"

